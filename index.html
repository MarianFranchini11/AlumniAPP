<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alumni — Control de asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3EC;
    --surface:#FFFFFF;
    --pitch:#0E1A33;
    --pitch-2:#182B52;
    --grass:#C9962A;
    --grass-dark:#A67816;
    --ink:#1B1E1C;
    --muted:#6B6F68;
    --line:#E1DED2;
    --green-bg:#DCEEDF; --green-tx:#1E5631; --green-line:#9FC9AC;
    --yellow-bg:#FBEFC7; --yellow-tx:#7A5A00; --yellow-line:#E3CE84;
    --gray-bg:#E9E7DD; --gray-tx:#5C5A50; --gray-line:#C9C6B8;
    --risk-bg:#F5DAD5; --risk-tx:#8C2F26; --risk-line:#DFA79D;
    --radius:10px;
    --shadow:0 1px 2px rgba(14,26,51,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; }
  .num{ font-family:'IBM Plex Mono',monospace; }
  a{color:inherit;}
  button{ font-family:'Inter',sans-serif; cursor:pointer; }

  header.top{
    background:var(--pitch);
    color:#EFEFE6;
    padding:18px 20px 16px;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute; right:-40px; top:-60px; width:180px; height:180px;
    border-radius:50%; border:2px solid rgba(255,255,255,0.06);
  }
  .top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; position:relative; z-index:1;}
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img.crest{ width:42px; height:42px; object-fit:contain; flex:none; }
  .brand .txt{ display:flex; flex-direction:column; gap:2px; }
  .brand .mark{ font-size:22px; font-weight:700; line-height:1; }
  .brand .sub{ font-size:12.5px; color:#AFC1DC; }
  .role-pill{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:999px; padding:6px 6px 6px 12px;
    font-size:12.5px; white-space:nowrap;
  }
  .role-pill .rlabel{ color:#DCE7E0; }
  .role-pill .rval{ font-weight:600; }
  .role-pill button{
    background:rgba(255,255,255,0.14); border:none; color:#fff;
    border-radius:999px; padding:5px 10px; font-size:12px; font-weight:500;
  }
  .role-pill button:hover{ background:rgba(255,255,255,0.24); }

  nav.tabs{
    display:flex; gap:6px; padding:10px 16px; background:var(--pitch-2);
  }
  nav.tabs button{
    flex:1; background:transparent; border:none; color:#C9DBD0;
    padding:9px 6px; border-radius:8px; font-size:13.5px; font-weight:500;
  }
  nav.tabs button.active{ background:var(--surface); color:var(--pitch); }

  main{ padding:16px; max-width:720px; margin:0 auto; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; margin-bottom:14px;
  }
  .row-between{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .section-title{ font-size:15px; font-weight:600; margin:0; }
  .hint{ font-size:12.5px; color:var(--muted); margin:4px 0 0; }

  .btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:8px; padding:8px 14px; font-size:13.5px; font-weight:500;
  }
  .btn:hover{ background:var(--bg); }
  .btn-primary{ background:var(--grass); color:#fff; border-color:var(--grass-dark); }
  .btn-primary:hover{ background:var(--grass-dark); }
  .btn-danger{ color:#8C2F26; border-color:var(--risk-line); background:#fff; }
  .btn-danger:hover{ background:var(--risk-bg); }
  .btn-sm{ padding:5px 10px; font-size:12.5px; }
  .btn[disabled]{ opacity:0.45; cursor:not-allowed; }

  input,select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; background:#fff; color:var(--ink); font-family:'Inter',sans-serif;
  }
  input:focus,select:focus{ outline:2px solid var(--grass); outline-offset:1px; border-color:var(--grass); }
  label.field{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px; }
  .form-grid{ display:grid; grid-template-columns:1fr 90px 1fr; gap:10px; margin-bottom:10px; }
  @media (max-width:520px){ .form-grid{ grid-template-columns:1fr 1fr; } .form-grid > div:nth-child(3){grid-column:1/-1;} }

  .player-row{
    display:flex; align-items:center; gap:12px; padding:10px 4px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .player-row:last-child{ border-bottom:none; }
  .row-actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .jersey{
    width:38px; height:38px; border-radius:50%; background:var(--pitch);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; flex:none;
    background-size:cover; background-position:center;
  }
  .p-info{ flex:1; min-width:0; }
  .p-name{ font-weight:500; font-size:14.5px; }
  .p-pos{ font-size:12px; color:var(--muted); }
  .status-pill{
    font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; white-space:nowrap;
    border:1px solid transparent;
  }
  .status-green{ background:var(--green-bg); color:var(--green-tx); border-color:var(--green-line); }
  .status-yellow{ background:var(--yellow-bg); color:var(--yellow-tx); border-color:var(--yellow-line); }
  .status-gray{ background:var(--gray-bg); color:var(--gray-tx); border-color:var(--gray-line); }
  .status-risk{ background:var(--risk-bg); color:var(--risk-tx); border-color:var(--risk-line); }

  .check-row{ display:flex; align-items:center; gap:12px; padding:9px 4px; border-bottom:1px solid var(--line); }
  .check-row:last-child{ border-bottom:none; }
  .check-row input[type=checkbox]{ width:20px; height:20px; accent-color:var(--grass); flex:none; }

  .session-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .session-item:last-child{ border-bottom:none; }
  .session-item:hover{ background:var(--bg); }
  .session-date{ font-weight:500; font-size:14px; }
  .session-count{ font-size:12.5px; color:var(--muted); }

  .empty{ text-align:center; padding:34px 10px; color:var(--muted); }
  .empty .ic{ font-size:26px; margin-bottom:8px; }

  .modal-bg{
    position:fixed; inset:0; background:rgba(22,30,26,0.5);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal{
    background:#fff; border-radius:12px; padding:20px; width:100%; max-width:340px;
  }
  .modal h3{ margin:0 0 4px; font-size:16px; }
  .modal p{ font-size:13px; color:var(--muted); margin:0 0 14px; }
  .modal-actions{ display:flex; gap:8px; margin-top:14px; }
  .modal-actions .btn{ flex:1; }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot-g{ background:#3E8E5C; } .dot-y{ background:#E3B23C; } .dot-r{ background:#B75B4F; }

  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:4px; }
  .stat{ background:var(--bg); border-radius:8px; padding:10px; text-align:center; }
  .stat .v{ font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:500; }
  .stat .l{ font-size:11px; color:var(--muted); margin-top:2px; }

  .jersey-sm{ width:30px; height:30px; border-radius:50%; background:var(--pitch); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:11px; flex:none; background-size:cover; background-position:center; }
  .photo-btn-row{ display:flex; align-items:center; gap:12px; margin:10px 0 14px; }
  .photo-preview{
    width:56px; height:56px; border-radius:50%; background:var(--bg); border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px;
    flex:none; background-size:cover; background-position:center; cursor:pointer; text-align:center;
  }
  .bar-track{ height:6px; background:var(--line); border-radius:999px; margin-top:6px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; }
  .month-row{ display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); }
  .month-row:last-child{ border-bottom:none; }
  .month-label{ font-size:13.5px; font-weight:500; width:110px; flex:none; }
  .month-bar-wrap{ flex:1; }
  .month-pct{ width:42px; text-align:right; font-size:13px; font-weight:600; flex:none; }

  .banner-info{
    font-size:12px; color:var(--muted); background:var(--bg); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; margin-bottom:14px;
  }
  .bf-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .bf-table th{ text-align:left; padding:8px 10px; color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.02em; border-bottom:1px solid var(--line); white-space:nowrap; }
  .bf-table td{ padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .bf-table input{ width:100%; min-width:90px; border:1px solid var(--line); border-radius:6px; padding:5px 7px; font-size:13px; background:var(--bg); color:inherit; font-family:inherit; }
  .bf-table input:disabled{ border-color:transparent; background:transparent; padding:5px 0; color:inherit; }
  .bf-name-cell{ font-weight:500; min-width:150px; }
  .bf-wrap{ overflow-x:auto; }
</style>

<script>
(function(){

var DEFAULT_PIN = "1234";
var state = {
  role: "user",
  tab: "plantilla",
  data: null,
  editingSessionId: null,
  editingPlayerId: null,
  tempNewPhoto: null,
  tempEditPhoto: null
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function todayISO(){
  var d = new Date();
  return d.toISOString().slice(0,10);
}

function weekStartISO(dateStr){
  var d = new Date(dateStr + "T00:00:00");
  var day = d.getDay();
  var diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}

function fmtDate(iso){
  var d = new Date(iso + "T00:00:00");
  var opts = { day:"2-digit", month:"short" };
  return d.toLocaleDateString("es-AR", opts);
}

function defaultData(){
  return {
    players: [],
    sessions: [],
    attendance: {},
    dues: {},
    fixture: [],
    adminPin: DEFAULT_PIN
  };
}

function monthKeyNow(){ return todayISO().slice(0,7); }

// Solo entrenamientos con fecha anterior a hoy (para Semana/Histórico: no cuentan los programados a futuro)
function pastSessions(){
  var today = todayISO();
  return state.data.sessions.filter(function(s){ return s.date < today; });
}

function daysUntil(dateStr){
  var today = new Date(todayISO()+"T00:00:00");
  var target = new Date(dateStr+"T00:00:00");
  return Math.round((target - today) / 86400000);
}

function monthDayLabel(iso){
  var parts = iso.split("-");
  if(parts.length !== 3) return iso;
  return parts[2] + "/" + parts[1] + "/" + parts[0];
}

// Próximos 5 vencimientos de ficha médica (ordenados por fecha). "alert" = vence en <=30 días o ya venció.
function getUpcomingMedicalAlerts(){
  return state.data.players
    .filter(function(p){ return p.vencimientoFicha; })
    .map(function(p){
      var days = daysUntil(p.vencimientoFicha);
      return { player:p, days:days, alert: days <= 30 };
    })
    .sort(function(a,b){ return a.days - b.days; })
    .slice(0,5);
}

function loadData(){

function resizeImageFile(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxDim = 160;
        var side = Math.min(img.width, img.height);
        var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        var canvas = document.createElement("canvas");
        canvas.width = maxDim; canvas.height = maxDim;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxDim, maxDim);
        resolve(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = function(){ reject(new Error("No se pudo leer la imagen")); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error("No se pudo leer el archivo")); };
    reader.readAsDataURL(file);
  });
}

}

// ---------- Estado semanal ----------
function computeWeeklyStatus(){
  var d = state.data;
  var past = pastSessions();
  var thisWeek = weekStartISO(todayISO());
  var sessionsThisWeek = past.filter(function(s){ return weekStartISO(s.date) === thisWeek; });
  var expected = 2;

  var sortedAll = past.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });

  return d.players.map(function(p){
    var presentThisWeek = sessionsThisWeek.filter(function(s){ return (d.attendance[s.id]||[]).indexOf(p.id) > -1; }).length;
    var totalSessions = sortedAll.length;
    var totalPresent = sortedAll.filter(function(s){ return (d.attendance[s.id]||[]).indexOf(p.id) > -1; }).length;

    var streak = 0;
    for(var i = sortedAll.length - 1; i >= 0; i--){
      var wasPresent = (d.attendance[sortedAll[i].id]||[]).indexOf(p.id) > -1;
      if(wasPresent) break;
      streak++;
    }

    var status, statusLabel;
    if(sessionsThisWeek.length === 0){
      status = "gray"; statusLabel = "Sin entrenamientos aún esta semana";
    } else if(presentThisWeek >= expected){
      status = "green"; statusLabel = "Posible titular";
    } else if(presentThisWeek >= 1){
      status = "yellow"; statusLabel = "Fue a " + presentThisWeek + " de " + Math.max(sessionsThisWeek.length, expected);
    } else {
      status = "gray"; statusLabel = "No fue esta semana";
    }

    return {
      player: p,
      presentThisWeek: presentThisWeek,
      sessionsThisWeek: sessionsThisWeek.length,
      status: status,
      statusLabel: statusLabel,
      pct: totalSessions ? Math.round((totalPresent/totalSessions)*100) : 0,
      streak: streak,
      atRisk: streak >= 3 && totalSessions > 0
    };
  }).sort(function(a,b){
    var order = { green:0, yellow:1, gray:2 };
    if(order[a.status] !== order[b.status]) return order[a.status]-order[b.status];
    return a.player.name.localeCompare(b.player.name);
  });
}

function monthLabel(mk){
  var parts = mk.split("-");
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, 1);
  var label = d.toLocaleDateString("es-AR", { month:"long", year:"numeric" });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

function monthShortLabel(mk){
  var parts = mk.split("-");
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, 1);
  var label = d.toLocaleDateString("es-AR", { month:"short" }).replace(".","");
  return label.charAt(0).toUpperCase() + label.slice(1) + " " + parts[0].slice(2);
}

function computeHistoricalStats(){
  var d = state.data;
  var past = pastSessions();
  var totalSessions = past.length;

  var perPlayer = d.players.map(function(p){
    var present = past.filter(function(s){ return (d.attendance[s.id]||[]).indexOf(p.id) > -1; }).length;
    var pct = totalSessions ? Math.round((present/totalSessions)*100) : 0;
    return { player:p, present:present, total:totalSessions, pct:pct };
  }).sort(function(a,b){ return b.pct - a.pct; });

  var teamAvg = perPlayer.length ? Math.round(perPlayer.reduce(function(s,r){ return s+r.pct; },0)/perPlayer.length) : 0;

  var monthKeysSet = {};
  past.forEach(function(s){ monthKeysSet[s.date.slice(0,7)] = true; });
  var monthKeys = Object.keys(monthKeysSet).sort();
  var months = monthKeys.map(function(mk){
    var sessionsInMonth = past.filter(function(s){ return s.date.slice(0,7) === mk; });
    var totalPossible = sessionsInMonth.length * d.players.length;
    var totalPresent = 0;
    sessionsInMonth.forEach(function(s){ totalPresent += (d.attendance[s.id]||[]).length; });
    return {
      key: mk,
      sessions: sessionsInMonth.length,
      avgPct: totalPossible ? Math.round((totalPresent/totalPossible)*100) : 0
    };
  });

  return { perPlayer:perPlayer, teamAvg:teamAvg, totalSessions:totalSessions, months:months };
}

function normName(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z\s]/g,"").replace(/\s+/g," ").trim();
}

function nameTokens(s){
  return normName(s).split(" ").filter(Boolean);
}

// Compara dos nombres completos de forma flexible: no exige que sean idénticos,
// alcanza con que coincida el primer nombre y el apellido (ignora nombres del medio, orden, tildes).
function namesLikelyMatch(nameA, nameB){
  var a = nameTokens(nameA), b = nameTokens(nameB);
  if(a.length < 1 || b.length < 1) return false;
  var firstMatch = a[0] === b[0] || a.indexOf(b[0]) > -1 || b.indexOf(a[0]) > -1;
  if(!firstMatch) return false;
  var lastA = a[a.length-1], lastB = b[b.length-1];
  var lastMatch = lastA === lastB || a.indexOf(lastB) > -1 || b.indexOf(lastA) > -1;
  return lastMatch;
}

function importBuenaFe(){
  var added = 0, updated = 0;
  BUENA_FE_DATA.forEach(function(entry){
    var fullName = (entry.nombre + " " + entry.apellido).trim();
    var match = state.data.players.find(function(p){ return namesLikelyMatch(p.name, fullName); });
    if(match){
      match.dni = entry.dni;
      match.nacimiento = entry.nacimiento;
      match.obraSocial = entry.obraSocial;
      match.telefono = entry.telefono;
      if(entry.vencimiento) match.vencimientoFicha = entry.vencimiento;
      updated++;
    } else {
      state.data.players.push({
        id: uid(), name: fullName, number: "", position: "Mediocampista", photo: null,
        dni: entry.dni, nacimiento: entry.nacimiento, obraSocial: entry.obraSocial,
        telefono: entry.telefono, vencimientoFicha: entry.vencimiento || ""
      });
      added++;
    }
  });
  return { added: added, updated: updated };
}

// ---------- Fusión de duplicados ----------
function findDuplicateGroups(){
  var players = state.data.players;
  var pairs = [];
  var used = {};
  for(var i=0;i<players.length;i++){
    for(var j=i+1;j<players.length;j++){
      if(used[players[j].id]) continue;
      if(namesLikelyMatch(players[i].name, players[j].name)){
        pairs.push([players[i], players[j]]);
        used[players[j].id] = true;
      }
    }
  }
  return pairs;
}

function mergePlayers(keepId, removeId){
  var d = state.data;
  var keep = d.players.find(function(p){ return p.id === keepId; });
  var remove = d.players.find(function(p){ return p.id === removeId; });
  if(!keep || !remove) return;
  ["dni","nacimiento","obraSocial","telefono","vencimientoFicha","observacionFicha","photo","number","position"].forEach(function(f){
    if(!keep[f] && remove[f]) keep[f] = remove[f];
  });
  if(remove.name && remove.name.length > keep.name.length) keep.name = remove.name;
  Object.keys(d.attendance || {}).forEach(function(sessionId){
    var arr = d.attendance[sessionId];
    if(!arr) return;
    var hadRemove = arr.indexOf(removeId) > -1;
    d.attendance[sessionId] = arr.filter(function(id){ return id !== removeId; });
    if(hadRemove && d.attendance[sessionId].indexOf(keepId) === -1) d.attendance[sessionId].push(keepId);
  });
  Object.keys(d.dues || {}).forEach(function(monthKey){
    var arr = d.dues[monthKey];
    if(!arr) return;
    var hadRemove = arr.indexOf(removeId) > -1;
    d.dues[monthKey] = arr.filter(function(id){ return id !== removeId; });
    if(hadRemove && d.dues[monthKey].indexOf(keepId) === -1) d.dues[monthKey].push(keepId);
  });
  d.players = d.players.filter(function(p){ return p.id !== removeId; });
}

// ---------- events ----------
function bindTabEvents(){
  var importBtn = document.getElementById("import-buenafe-btn");
  if(importBtn) importBtn.onclick = async function(){
    importBtn.disabled = true;
    importBtn.textContent = "Importando...";
    var result = importBuenaFe();
    state.importMessage = "Listo: " + result.added + " jugador(es) agregado(s), " + result.updated + " actualizado(s).";
    await persist();
    render();
  };

  var exportBtn = document.getElementById("export-excel-btn");
  if(exportBtn) exportBtn.onclick = function(){ exportBuenaFeExcel(); };

  Array.prototype.forEach.call(document.querySelectorAll("[data-merge-a]"), function(btn){
    btn.onclick = async function(){
      mergePlayers(btn.dataset.mergeA, btn.dataset.mergeB);
      await persist();
      render();
    };
  });

  var importFixtureBtn = document.getElementById("import-fixture-btn");
  if(importFixtureBtn) importFixtureBtn.onclick = async function(){
    importFixtureBtn.disabled = true;
    importFixtureBtn.textContent = "Importando...";
    var result = importFixture();
    state.fixtureMessage = "Listo: " + result.added + " fecha(s) agregada(s), " + result.updated + " actualizada(s).";
    await persist();
    render();
  };

  var addFixtureBtn = document.getElementById("add-fixture-btn");
  if(addFixtureBtn) addFixtureBtn.onclick = async function(){
    state.data.fixture.push({ id: uid(), fecha: String(state.data.fixture.length + 1), dia: "", hora: "", cancha: "", rival: "", resultado: "" });
    await persist();
    render();
  };

  Array.prototype.forEach.call(document.querySelectorAll("[data-fx-id]"), function(input){
    input.onchange = async function(){
      var f = state.data.fixture.find(function(fx){ return fx.id === input.dataset.fxId; });
      if(!f) return;
      f[input.dataset.fxField] = input.value.trim();
      await persist();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-fx-del]"), function(btn){
    btn.onclick = async function(){
      state.data.fixture = state.data.fixture.filter(function(f){ return f.id !== btn.dataset.fxDel; });
      await persist();
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-bf-id]"), function(input){
    input.onchange = async function(){
      var p = state.data.players.find(function(pl){ return pl.id === input.dataset.bfId; });
      if(!p) return;
      p[input.dataset.bfField] = input.value.trim();
      await persist();
    };
  });

  var npPhotoBtn = document.getElementById("np-photo-btn");
  if(npPhotoBtn) npPhotoBtn.onclick = function(){ document.getElementById("np-photo-input").click(); };

  var npPhotoInput = document.getElementById("np-photo-input");
  if(npPhotoInput) npPhotoInput.onchange = async function(e){
    var file = e.target.files[0];
    if(!file) return;
    try{
      var dataUrl = await resizeImageFile(file);
      state.tempNewPhoto = dataUrl;
      var prev = document.getElementById("np-photo-preview");
      prev.style.backgroundImage = "url(" + dataUrl + ")";
      prev.textContent = "";
    }catch(err){ console.error(err); }
  };

  var addBtn = document.getElementById("add-player-btn");
  if(addBtn) addBtn.onclick = async function(){
    var name = document.getElementById("np-name").value.trim();
    var number = document.getElementById("np-number").value.trim();
    var pos = document.getElementById("np-pos").value;
    if(!name) return;
    state.data.players.push({ id: uid(), name: name, number: number, position: pos, photo: state.tempNewPhoto || null });
    state.tempNewPhoto = null;
    await persist();
    render();
  };

  Array.prototype.forEach.call(document.querySelectorAll("[data-edit-player]"), function(btn){
    btn.onclick = function(){ showEditPlayerModal(btn.getAttribute("data-edit-player")); };
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-del-player]"), function(btn){
    btn.onclick = async function(){
      var id = btn.getAttribute("data-del-player");
      state.data.players = state.data.players.filter(function(p){ return p.id !== id; });
      await persist();
      render();
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-dues-cell]"), function(btn){
    btn.onclick = async function(){
      var id = btn.dataset.duesCell;
      var mk = btn.dataset.duesMonth;
      if(!state.data.dues[mk]) state.data.dues[mk] = [];
      var idx = state.data.dues[mk].indexOf(id);
      if(idx > -1) state.data.dues[mk].splice(idx,1);
      else state.data.dues[mk].push(id);
      await persist();
      render();
    };
  });

  var changePinBtn = document.getElementById("change-pin-btn");
  if(changePinBtn) changePinBtn.onclick = showChangePinModal;

  var newSessionBtn = document.getElementById("new-session-btn");
  if(newSessionBtn) newSessionBtn.onclick = async function(){
    var dateInput = document.getElementById("new-session-date");
    var dateVal = (dateInput && dateInput.value) ? dateInput.value : todayISO();
    var id = uid();
    state.data.sessions.push({ id: id, date: dateVal });
    state.data.attendance[id] = [];
    await persist();
    if(dateVal === todayISO()) state.editingSessionId = id;
    render();
  };

  Array.prototype.forEach.call(document.querySelectorAll("[data-open-session]"), function(el){
    el.onclick = function(){
      state.editingSessionId = el.getAttribute("data-open-session");
      render();
    };
  });

  var closeEditorBtn = document.getElementById("close-editor-btn");
  if(closeEditorBtn) closeEditorBtn.onclick = function(){ state.editingSessionId = null; render(); };

  var saveSessionBtn = document.getElementById("save-session-btn");
  if(saveSessionBtn) saveSessionBtn.onclick = async function(){
    var checks = document.querySelectorAll("[data-attend-player]");
    var present = [];
    Array.prototype.forEach.call(checks, function(c){
      if(c.checked) present.push(c.getAttribute("data-attend-player"));
    });
    state.data.attendance[state.editingSessionId] = present;
    await persist();
    state.editingSessionId = null;
    render();
  };

  var deleteSessionBtn = document.getElementById("delete-session-btn");
  if(deleteSessionBtn) deleteSessionBtn.onclick = async function(){
    var id = state.editingSessionId;
    state.data.sessions = state.data.sessions.filter(function(s){ return s.id !== id; });
    delete state.data.attendance[id];
    await persist();
    state.editingSessionId = null;
    render();
  };
}

loadData();
})();
</script>
